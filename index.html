<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المساعد الذكي لحجز تنظيف المفروشات</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Interactive map (Leaflet + OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #e0e7ff 100%);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
    #chatContainer .message-text { overflow-wrap: anywhere; word-break: normal; white-space: pre-wrap; }
  </style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center p-0 md:p-4 lg:p-6 overflow-x-hidden">

  <!-- Main Elegant Chat Container -->
  <main class="w-full max-w-3xl h-[100dvh] md:h-[88vh] md:max-h-[850px] bg-white/95 backdrop-blur-xl md:rounded-3xl shadow-2xl border border-purple-100 flex flex-col overflow-hidden">
    
    <!-- Modern Royal Purple & Indigo Header -->
    <header class="bg-gradient-to-l from-purple-700 via-violet-600 to-indigo-600 px-4 md:px-6 py-3.5 md:py-4 text-white flex items-center justify-between shrink-0 shadow-md">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="w-10 h-10 md:w-11 md:h-11 rounded-2xl bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center shadow-inner">
            <i data-lucide="sparkles" class="w-5 h-5 md:w-6 md:h-6 text-white"></i>
          </div>
          <span class="w-2.5 h-2.5 md:w-3 md:h-3 bg-emerald-400 rounded-full absolute -bottom-0.5 -right-0.5 ring-2 ring-purple-700"></span>
        </div>
        <div>
          <h1 class="font-extrabold text-sm md:text-lg tracking-wide">خدمة العملاء والحجز الذكي</h1>
          <p class="text-[11px] md:text-xs text-purple-100 flex items-center gap-1.5">
            <span>العناية وتنظيف المفروشات بالبخار</span>
            <span class="hidden sm:inline">•</span>
            <span class="text-emerald-300 font-semibold">يرد فوريًا</span>
          </p>
        </div>
      </div>

      <button onclick="resetChat()" class="px-2.5 md:px-3 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 border border-white/20 text-[11px] md:text-xs font-bold flex items-center gap-1.5 transition shrink-0">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>محادثة جديدة</span>
      </button>
    </header>

    <!-- Chat Messages Area -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-3 md:p-5 space-y-4 bg-slate-50/70">
      <!-- Welcome message is rendered on page load with its local timestamp. -->
    </div>

    <!-- Bottom Input Bar -->
    <div class="p-3 md:p-3.5 bg-white border-t border-slate-100 shrink-0">
      <form onsubmit="sendMessage(event)" class="flex items-end gap-2">
        <!-- Location Helper Button -->
        <button
          type="button"
          onclick="openMapModal()"
          class="bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 px-3 md:px-3.5 py-2.5 md:py-3 rounded-2xl text-[11px] md:text-xs font-bold flex items-center gap-1 transition shrink-0 shadow-sm"
          title="تحديد الموقع أو إرسال العنوان بالتفصيل"
        >
          <i data-lucide="map-pin" class="w-4 h-4 text-purple-600"></i>
          <span class="hidden sm:inline">إرسال العنوان</span>
        </button>

        <textarea
          id="userInput"
          rows="1"
          placeholder="اكتب رسالتك هنا..."
          onkeydown="handleInputKeydown(event)"
          oninput="autoResizeInput(this)"
          class="flex-1 bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 rounded-2xl px-3.5 md:px-4 py-2.5 md:py-3 text-xs md:text-sm focus:outline-none focus:border-purple-500 focus:bg-white transition resize-none max-h-32 leading-relaxed"
          autocomplete="off"
        ></textarea>

        <button
          id="sendBtn"
          type="submit"
          class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white px-4 md:px-5 py-2.5 md:py-3 rounded-2xl font-bold text-xs md:text-sm flex items-center gap-1.5 transition shrink-0 shadow-md shadow-purple-500/20"
        >
          <span>إرسال</span>
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

  </main>

  <!-- Location Modal -->
  <div id="mapModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-3 md:p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-purple-100 flex flex-col max-h-[90vh]">
      <div class="p-3.5 md:p-4 bg-gradient-to-l from-purple-700 to-indigo-600 text-white flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <i data-lucide="map-pin" class="w-5 h-5"></i>
          <h3 class="font-bold text-sm">مشاركة العنوان التفصيلي للتيم</h3>
        </div>
        <button onclick="closeMapModal()" class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30">✕</button>
      </div>

      <div class="p-3.5 md:p-4 space-y-3 overflow-y-auto flex-1">
        <div class="flex flex-wrap gap-2">
          <button type="button" onclick="locateCustomerNow()" class="flex-1 min-w-[160px] bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-extrabold shadow-sm">📍 حدد موقعي الآن</button>
          <button type="button" onclick="centerMapOnEgypt()" class="px-3.5 py-2.5 md:py-3 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold hover:bg-slate-200">عرض مصر</button>
        </div>
        <p id="locationStatus" class="text-xs text-slate-600 bg-slate-50 rounded-xl p-3 border border-slate-100">اسمح للمتصفح بالوصول للموقع، أو اضغط على الخريطة لتحديد مكانك يدويًا.</p>
        <div id="customerMap" class="w-full h-[260px] md:h-[320px] rounded-2xl border border-slate-200 z-0"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-[11px] font-bold text-slate-600 mb-1">خط العرض</label><input id="modalLatitude" readonly dir="ltr" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs" placeholder="لم يتم التحديد"></div>
          <div><label class="block text-[11px] font-bold text-slate-600 mb-1">خط الطول</label><input id="modalLongitude" readonly dir="ltr" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs" placeholder="لم يتم التحديد"></div>
        </div>
        <div><label class="block text-xs font-bold text-slate-700 mb-1">العنوان التفصيلي (المنطقة، الشارع، رقم العمارة، الدور)</label><input id="modalDetailedAddress" type="text" placeholder="مثال: المعادي - شارع 9 - عمارة 14 - الدور التاني" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-purple-600" /></div>
        <div class="flex items-center justify-between gap-2"><span class="text-[11px] text-slate-500">رابط الخريطة سيتولد تلقائيًا بعد تحديد الموقع.</span><a id="previewMapLink" href="#" target="_blank" rel="noopener" class="hidden text-xs font-bold text-indigo-600 underline">معاينة الموقع</a></div>
      </div>

      <div class="p-3.5 md:p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3 shrink-0">
        <button type="button" onclick="closeMapModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200">إلغاء</button>
        <button type="button" onclick="confirmLocationModal()" class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 md:px-5 py-2.5 rounded-xl text-xs font-bold shadow">
          إرسال العنوان للبوت 📍
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jlaczyfdaxcdevcozcnx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vih4Lf_VGHooa_IxoicuCA_X0Bg2ESc';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let chatHistory = [];
    let catalogCache = [];
    let lastSharedLocationUrl = '';
    let customerMapInstance = null;
    let customerMapMarker = null;
    let selectedCustomerCoordinates = null;
    let requestInProgress = false;
    let conversationSessionId = createSessionId();
    let cachedWorkingModel = '';
    let lastSubmittedInteractionId = null;

    function createSessionId() {
      return (crypto.randomUUID ? crypto.randomUUID() : `tw-${Date.now()}-${Math.random().toString(36).slice(2)}`);
    }

    function getGeminiKey() {
      return (localStorage.getItem('GM_KEY') || '').trim();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function handleInputKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage(e);
      }
    }

    function autoResizeInput(el) {
      if (!el) return;
      el.style.height = 'auto';
      el.style.height = `${Math.min(el.scrollHeight, 128)}px`;
    }

    async function logConversation(event) {
      try {
        await supabaseClient.from('conversation_logs').insert([{
          session_id: conversationSessionId,
          speaker: event.speaker || 'system',
          message: String(event.message || '').slice(0, 12000),
          event_type: event.event_type || 'message',
          tool_name: event.tool_name || null,
          tool_data: event.tool_data || null,
          customer_name: event.customer_name || null,
          customer_phone: normalizeEgyptianPhone(event.customer_phone) || null
        }]);
      } catch (e) { console.warn('Conversation log skipped:', e); }
    }

    function normalizeMapsUrl(raw) {
      const value = String(raw || '').trim();
      if (!value) return null;
      if (!/^https?:\/\//i.test(value)) return null;
      try {
        const url = new URL(value);
        const host = url.hostname.toLowerCase();
        if (!(host === 'maps.app.goo.gl' || host.endsWith('google.com') || host.endsWith('goo.gl') || host === 'maps.google.com')) return null;
        return url.href;
      } catch { return null; }
    }

    function getEgyptDateTime() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit',
        weekday: 'long', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      const arabicDay = new Intl.DateTimeFormat('ar-EG', {
        timeZone: 'Africa/Cairo', weekday: 'long'
      }).format(new Date());
      return {
        date: `${values.year}-${values.month}-${values.day}`,
        day: arabicDay,
        time: new Intl.DateTimeFormat('ar-EG', {
          timeZone: 'Africa/Cairo', hour: 'numeric', minute: '2-digit', hour12: true
        }).format(new Date())
      };
    }

    function normalizeEgyptianPhone(value) {
      let phone = String(value || '').replace(/[\s٠-٩]/g, ch => {
        if (/^[٠-٩]$/.test(ch)) return String('٠١٢٣٤٥٦٧٨٩'.indexOf(ch));
        return '';
      }).replace(/[()\-]/g, '');
      if (phone.startsWith('+20')) phone = '0' + phone.slice(3);
      else if (phone.startsWith('20') && phone.length === 12) phone = '0' + phone.slice(2);
      return /^01[0125]\d{8}$/.test(phone) ? phone : null;
    }

    function phoneValidationResult(value) {
      const normalized = normalizeEgyptianPhone(value);
      return normalized
        ? { valid: true, phone: normalized }
        : { valid: false, status: 'incomplete_or_invalid_phone', message: 'رقم الهاتف ناقص عن 11 رقم أو غير صحيح، يرجى مراجعة الرقم وإرساله كاملاً من 11 رقم.' };
    }

    function getNameParts(value) {
      return String(value || '')
        .trim()
        .replace(/[^\p{L}\s]/gu, ' ')
        .split(/\s+/)
        .filter(Boolean);
    }

    function validateClientName(value) {
      const parts = getNameParts(value);
      if (parts.length < 2) {
        return { valid: false, status: 'single_name_not_allowed', message: 'الاسم أحادي، يجب أن يرسل العميل الاسم ثنائي على الأقل.' };
      }
      return { valid: true, parts, normalizedName: parts.join(' ') };
    }

    async function loadInitialCatalog() {
      const { data } = await supabaseClient.from('services_catalog').select('*');
      catalogCache = data || [];
    }

    function openMapModal() {
      const modal = document.getElementById('mapModal');
      modal.classList.remove('hidden'); modal.classList.add('flex');
      setTimeout(() => {
        if (!customerMapInstance) {
          customerMapInstance = L.map('customerMap', { zoomControl: true }).setView([30.0444, 31.2357], 11);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(customerMapInstance);
          customerMapInstance.on('click', e => setCustomerMapPoint(e.latlng.lat, e.latlng.lng, 'تم تحديد الموقع يدويًا.'));
        }
        customerMapInstance.invalidateSize();
      }, 180);
    }

    function closeMapModal() {
      document.getElementById('mapModal').classList.add('hidden');
      document.getElementById('mapModal').classList.remove('flex');
    }

    function centerMapOnEgypt() {
      if (customerMapInstance) customerMapInstance.setView([26.8206, 30.8025], 6);
    }

    function setCustomerMapPoint(lat, lng, statusText) {
      selectedCustomerCoordinates = { latitude: Number(lat), longitude: Number(lng) };
      const point = [selectedCustomerCoordinates.latitude, selectedCustomerCoordinates.longitude];
      if (!customerMapMarker) {
        customerMapMarker = L.marker(point, { draggable: true }).addTo(customerMapInstance);
        customerMapMarker.on('dragend', () => {
          const p = customerMapMarker.getLatLng();
          setCustomerMapPoint(p.lat, p.lng, 'تم تحديث موقع العلامة.');
        });
      } else customerMapMarker.setLatLng(point);
      customerMapInstance.setView(point, Math.max(customerMapInstance.getZoom(), 16));
      document.getElementById('modalLatitude').value = selectedCustomerCoordinates.latitude.toFixed(7);
      document.getElementById('modalLongitude').value = selectedCustomerCoordinates.longitude.toFixed(7);
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${selectedCustomerCoordinates.latitude},${selectedCustomerCoordinates.longitude}`)}`;
      const link = document.getElementById('previewMapLink'); link.href = url; link.classList.remove('hidden');
      document.getElementById('locationStatus').textContent = statusText || 'تم تحديد الموقع بنجاح.';
    }

    function locateCustomerNow() {
      const status = document.getElementById('locationStatus');
      if (!navigator.geolocation) { status.textContent = 'المتصفح لا يدعم تحديد الموقع.'; return; }
      status.textContent = 'جارٍ تحديد موقعك…';
      navigator.geolocation.getCurrentPosition(pos => {
        setCustomerMapPoint(pos.coords.latitude, pos.coords.longitude, 'تم تحديد موقعك بنجاح.');
      }, err => {
        status.textContent = 'تعذر تحديد الموقع تلقائيًا، يرجى التحديد من الخريطة يدويًا.';
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    }

    function confirmLocationModal() {
      const address = document.getElementById('modalDetailedAddress').value.trim();
      if (!selectedCustomerCoordinates) { alert('حدد موقعك أولاً من الخريطة.'); return; }
      if (!address) { alert('اكتب العنوان التفصيلي.'); return; }
      const { latitude, longitude } = selectedCustomerCoordinates;
      lastSharedLocationUrl = `https://www.google.com/maps/search/?api=1&query=${latitude},${longitude}`;
      closeMapModal();
      const input = document.getElementById('userInput');
      input.value = `📍 عنواني بالتفصيل: ${address}\nإحداثيات موقعي: ${latitude}, ${longitude}\nرابط Google Maps: ${lastSharedLocationUrl}`;
      autoResizeInput(input);
      sendMessage(new Event('submit'));
      document.getElementById('modalDetailedAddress').value = '';
    }

    function formatAdminDetails(summaryText, detailsText, orderMatchNote) {
      const cleanSummary = String(summaryText || '').trim();
      const cleanDetails = String(detailsText || '').trim();
      const cleanOrderNote = String(orderMatchNote || '').trim();
      const baseSummary = cleanSummary || cleanDetails;
      const baseDetails = cleanDetails || cleanSummary;
      const lines = [
        `ملخص الشكوى: ${baseSummary}`,
        `التفاصيل الموضحة: ${baseDetails}`
      ];
      if (cleanOrderNote) {
        lines.push(`مطابقة الأوردر السابق: ${cleanOrderNote}`);
      }
      return lines.join('\n');
    }

    async function fetchCustomerBookingsByCriteria(phone, nameQuery) {
      let query = supabaseClient.from('bookings').select('*').order('created_at', { ascending: false }).limit(10);
      if (phone) {
        query = query.eq('client_phone', phone);
      } else if (nameQuery) {
        query = query.ilike('client_name', `%${nameQuery}%`);
      }
      const { data, error } = await query;
      return { data: data || [], error };
    }

    async function executeToolCall(call) {
      const { name, args = {} } = call;

      if (name === 'request_customer_location') {
        openMapModal();
        const result = { status: 'location_picker_opened', message: 'تم فتح خريطة تحديد الموقع للعميل.' };
        await logConversation({
          speaker: 'tool',
          event_type: 'tool_call',
          tool_name: name,
          tool_data: { args, result },
          message: `فتح خريطة تحديد الموقع للعميل`
        });
        return result;
      }

      if (name === 'calculate_cleaning_price') {
        const { data: catalog } = await supabaseClient.from('services_catalog').select('*');
        let total = 0;
        const details = [];
        const missingItems = [];
        for (const reqItem of (args.items || [])) {
          const found = catalog?.find(c => c.item_key === reqItem.item_key);
          if (found && Number.isFinite(Number(found.price))) {
            const quantity = Number(reqItem.quantity);
            const sub = Number(found.price) * quantity;
            total += sub;
            details.push(`${quantity} ${found.item_name_ar} (${sub} ج.م)`);
          } else {
            missingItems.push(reqItem.item_key);
          }
        }
        const result = missingItems.length
          ? { status: 'missing_catalog_items', missing_items: missingItems }
          : { status: 'success', total_price: total, breakdown: details.join(' + ') };

        await logConversation({
          speaker: 'tool',
          event_type: 'tool_call',
          tool_name: name,
          tool_data: { args, result },
          message: `حساب السعر: ${result.breakdown || JSON.stringify(result)}`
        });
        return result;
      }

      if (name === 'check_schedule_by_area') {
        const clientArea = (args.client_area || '').trim();
        const { data: zones } = await supabaseClient.from('zones').select('*');
        const matchedZone = zones?.find(z => (z.covered_areas || []).some(a => clientArea.includes(a) || a.includes(clientArea)));
        const today = getEgyptDateTime().date;
        let result;
        if (!matchedZone) {
          result = { status: 'available', message: 'متاح الحجز في الفترات المعتادة.' };
        } else {
          const { data: existingBookings } = await supabaseClient.from('bookings').select('booking_date, time_slot, area').eq('zone_id', matchedZone.id).gte('booking_date', today);
          result = { status: 'matched_zone', zone_name: matchedZone.zone_name, team_current_bookings: existingBookings || [] };
        }

        await logConversation({
          speaker: 'tool',
          event_type: 'tool_call',
          tool_name: name,
          tool_data: { args, result },
          message: `فحص المواعيد للمنطقة (${clientArea}): ${result.zone_name || result.message}`
        });
        return result;
      }

      if (name === 'submit_customer_interaction') {
        const phoneNormalized = normalizeEgyptianPhone(args.customer_phone);
        if (args.customer_phone && !phoneNormalized) {
          return phoneValidationResult(args.customer_phone);
        }

        const cleanName = String(args.customer_name || '').trim() || 'عميل';
        const cleanSubject = String(args.subject || '').trim() || 'شكوى أو طلب عميل';

        const { data: prevBookings } = await fetchCustomerBookingsByCriteria(
          phoneNormalized,
          cleanName !== 'عميل' ? cleanName : ''
        );
        const latestBooking = (prevBookings && prevBookings[0]) || null;
        const previousItemsSummary = latestBooking?.items_summary || '';
        const combinedText = `${cleanSubject} ${args.summary || ''} ${args.details || ''}`.toLowerCase();

        let orderMatchNote = '';
        let serviceMismatch = false;
        if (previousItemsSummary) {
          const prevLower = previousItemsSummary.toLowerCase();
          const mentionsMattress = /مرتب|مراتب/.test(combinedText);
          const mentionsCarpet = /سجاد|سجاده|سجادة/.test(combinedText);
          const mentionsSofa = /انتريه|ركنه|ركنة|صالون|كنب/.test(combinedText);

          if (mentionsMattress && !/مرتب|مراتب/.test(prevLower)) {
            serviceMismatch = true;
            orderMatchNote = `الأوردر السابق المسجل للعميل كان (${previousItemsSummary}) بتاريخ ${latestBooking.booking_date || ''} ولم يتضمن مراتب.`;
          } else if (mentionsCarpet && !/سجاد|سجاده|سجادة/.test(prevLower)) {
            serviceMismatch = true;
            orderMatchNote = `الأوردر السابق المسجل للعميل كان (${previousItemsSummary}) بتاريخ ${latestBooking.booking_date || ''} ولم يتضمن سجاد.`;
          } else if (mentionsSofa && !/انتريه|ركنه|ركنة|صالون|كنب/.test(prevLower)) {
            serviceMismatch = true;
            orderMatchNote = `الأوردر السابق المسجل للعميل كان (${previousItemsSummary}) بتاريخ ${latestBooking.booking_date || ''} ولم يتضمن أنترية/صالون.`;
          } else {
            orderMatchNote = `مطابق للأوردر السابق (${previousItemsSummary}).`;
          }
        }

        const formattedDetails = formatAdminDetails(args.summary, args.details, orderMatchNote);
        const allowedCategories = [
          'cleaning_complaint',
          'technician_complaint',
          'response_complaint',
          'reschedule_request',
          'callback_request',
          'extra_request',
          'general_note',
          'other'
        ];
        const category = allowedCategories.includes(args.category) ? args.category : 'other';
        const allowedPriorities = ['low', 'normal', 'high', 'urgent'];
        const priority = allowedPriorities.includes(args.priority) ? args.priority : 'high';

        const { data, error } = await supabaseClient
          .from('customer_interactions')
          .insert([{
            customer_name: cleanName,
            customer_phone: phoneNormalized || null,
            category,
            priority,
            subject: cleanSubject,
            details: formattedDetails,
            status: 'new'
          }])
          .select()
          .single();

        if (!error && data?.id) {
          lastSubmittedInteractionId = data.id;
        }

        const result = error
          ? { status: 'error', message: error.message }
          : {
              status: 'interaction_saved',
              interaction_details: data,
              previous_booking: latestBooking,
              previous_items_summary: previousItemsSummary,
              service_mismatch_with_last_order: serviceMismatch

        await logConversation({
          speaker: 'tool',
          event_type: 'interaction_submitted',
          tool_name: name,
          tool_data: { args, result },
          customer_name: cleanName,
          customer_phone: phoneNormalized || null,
          message: error
            ? `خطأ أثناء تسجيل الشكوى/الطلب: ${error.message}`
            : `تم تسجيل (${cleanSubject}) للعميل ${cleanName} في قائمة الشكاوى والطلبات`

      if (name === 'append_interaction_note') {

        if (!noteBody) {
          return { status: 'error', message: 'لا يوجد نص ملاحظة من العميل لإضافته.' };

        let targetInteraction = null;
        if (args.interaction_id) {

            .from('customer_interactions')
            .select('*')
            .eq('id', args.interaction_id)
            .single();

        } else if (lastSubmittedInteractionId) {
          const { data } = await supabaseClient
            .from('customer_interactions')
            .select('*')
            .eq('id', lastSubmittedInteractionId)
            .single();
          targetInteraction = data || null;
        }

        if (!targetInteraction) {
          let q = supabaseClient
            .from('customer_interactions')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(5);
          if (phoneNormalized) q = q.eq('customer_phone', phoneNormalized);
          else if (nameQuery) q = q.ilike('customer_name', `%${nameQuery}%`);
          const { data } = await q;
          targetInteraction = (data && data[0]) || null;
        }

        if (!targetInteraction) {
          return {
            status: 'not_found',
            message: 'لم يتم العثور على شكوى سابقة للعميل لإلحاق الملاحظة بها.'
          };
        }

        const formattedCustomerNote = `ملاحظة من العميل: ${noteBody}`;
        const existingNotes = String(targetInteraction.admin_notes || '').trim();
        const updatedNotes = existingNotes
          ? `${existingNotes}\n${formattedCustomerNote}`
          : formattedCustomerNote;

        const updates = {
          admin_notes: updatedNotes,
          updated_at: new Date().toISOString()
        };
        if (phoneNormalized && !targetInteraction.customer_phone) {
          updates.customer_phone = phoneNormalized;
        }
        if (nameQuery && (!targetInteraction.customer_name || targetInteraction.customer_name === 'عميل')) {
          updates.customer_name = nameQuery;
        }

        const { data: updated, error } = await supabaseClient
          .from('customer_interactions')
          .update(updates)
          .eq('id', targetInteraction.id)
          .select()
          .single();

        if (!error && updated?.id) {
          lastSubmittedInteractionId = updated.id;
        }

        const result = error
          ? { status: 'error', message: error.message }
          : { status: 'note_appended_to_existing_interaction', interaction_details: updated };

        await logConversation({
          speaker: 'tool',
          event_type: 'interaction_note_appended',
          tool_name: name,
          tool_data: { args, result },

          customer_phone: updated?.customer_phone || targetInteraction.customer_phone,
          message: error
            ? `خطأ أثناء إضافة ملاحظة العميل: ${error.message}`
            : `تم إلحاق ملاحظة العميل بنفس الشكوى (${updated.subject})`
        });
        return result;
      }

      if (name === 'lookup_customer_bookings') {
        const phone = normalizeEgyptianPhone(args.client_phone);
        const nameQuery = String(args.client_name || '').trim();
        const { data, error } = await fetchCustomerBookingsByCriteria(phone, nameQuery);

        let duplicateNameFound = false;
        if (!error && nameQuery) {
          const { data: sameNameRows } = await supabaseClient
            .from('bookings')
            .select('id, client_name, client_phone')
            .ilike('client_name', `%${nameQuery}%`)
            .limit(10);
          const distinctPhones = new Set((sameNameRows || []).map(r => r.client_phone).filter(Boolean));
          if ((sameNameRows || []).length > 0 && (!phone || (distinctPhones.size > 0 && !distinctPhones.has(phone)))) {

          }

        const result = error
          ? { status: 'error', message: error.message }
          : {
              status: 'success',

                : undefined

          speaker: 'tool',
          event_type: 'tool_call',
          tool_name: name,
          tool_data: { args, result },

      if (name === 'update_booking_schedule') {
        const bookingId = args.booking_id;
        const phone = normalizeEgyptianPhone(args.client_phone);
        const nameQuery = String(args.client_name || '').trim();

        const { data: updated, error } = await supabaseClient

      if (name === 'update_booking_status') {

        const nameQuery = String(args.client_name || '').trim();
        const allowedStatuses = ['confirmed', 'pending', 'cancelled', 'completed'];
        const nextStatus = allowedStatuses.includes(args.status) ? args.status : 'pending';

        let targetBooking = null;
        if (bookingId) {
          const { data } = await supabaseClient.from('bookings').select('*').eq('id', bookingId).single();

        const { data: existingSameName } = await supabaseClient
          .from('bookings')
          .select('id, client_name, client_phone')
          .ilike('client_name', nameCheck.normalizedName)
          .limit(5);

        if (nameCheck.parts.length === 2 && hasOtherPhoneSameName && !args.allow_duplicate_two_part_name) {
          return {
            valid: false,
            status: 'duplicate_two_part_name',
            message: 'الاسم الثنائي ده مسجل لعميل آخر بالفعل؛ اطلب من العميل يكتب الاسم ثلاثي للتأكيد.'

        const { data, error } = await supabaseClient.from('bookings').insert([{
          client_name: nameCheck.normalizedName,
          client_phone: phoneCheck.phone,
          area: String(args.area).trim(),
          detailed_address: args.detailed_address || null,
          maps_url: normalizeMapsUrl(args.maps_url || lastSharedLocationUrl),

          longitude: args.longitude || null,

          time_slot: args.time_slot,

        }]).select().single();

        const result = error ? { status: 'error', message: error.message } : { status: 'booked_successfully', booking_details: data };
        await logConversation({
          speaker: 'tool',
          event_type: 'booking_confirmed',
          tool_name: name,
          tool_data: { args, result },
          customer_name: nameCheck.normalizedName,
          customer_phone: phoneCheck.phone,
          message: error ? `خطأ أثناء تأكيد الحجز: ${error.message}` : `تم تأكيد الحجز للعميل ${nameCheck.normalizedName} (${phoneCheck.phone}) - الإجمالي: ${args.total_price} ج.م`
        });
        return result;
      }

      return { status: 'success' };
    }

    function isTextChatModel(name) {
      const clean = String(name || '').toLowerCase();
      if (!clean.startsWith('gemini-')) return false;
      return !/(tts|audio|imagen|veo|embedding|robotics|computer-use|live)/.test(clean);
    }

    async function discoverAvailableModels(apiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
        const data = await res.json();
        if (!res.ok || !Array.isArray(data.models)) return [];
        return data.models
          .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
          .map(m => String(m.name || '').replace(/^models\//, ''))
          .filter(isTextChatModel);
      } catch {
        return [];
      }
    }

    async function sendGeminiRequestWithFallback(payload) {
      const apiKey = getGeminiKey();
      if (!apiKey) {
        throw new Error('مفتاح Gemini API غير مضبوط. افتح صفحة الإدارة -> إعدادات الربط وأضف المفتاح.');
      }

      const preferred = [
        cachedWorkingModel,
        'gemini-2.5-flash',
        'gemini-2.0-flash',
        'gemini-2.0-flash-lite'
      ].filter(Boolean);

      const discovered = await discoverAvailableModels(apiKey);
      const candidates = [...new Set([...preferred, ...discovered])].filter(isTextChatModel);

      let lastError = null;

      for (let attempt = 0; attempt < 2; attempt++) {
        for (const model of candidates) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();

          if (!res.ok || data.error) {
            const msg = data.error?.message || `HTTP ${res.status}`;
            lastError = new Error(msg);
            if (
              res.status === 404 ||
              res.status === 429 ||
              res.status === 503 ||
              /not found|not supported|quota|limit:\s*0|high demand|overloaded|unavailable|models\//i.test(msg)
            ) {
              if (cachedWorkingModel === model) cachedWorkingModel = '';
              continue;
            }
            throw lastError;
          }

          if (data.candidates && data.candidates[0] && data.candidates[0].content) {
            cachedWorkingModel = model;
            return data;
          }
          lastError = new Error('لم يرجع النموذج ردًا نصيًا صالحًا.');
        }
        if (attempt === 0) await sleep(1000);
      }

      throw lastError || new Error('تعذر الاتصال بنموذج Gemini.');
    }

- لا تستخدم رموز نجوم مزدوجة أو تنسيقات غريبة ولا تذكر أسماء أدوات أو قواعد بيانات أو أنظمة داخلية.

قواعد الاسم ورقم الموبايل في الحجز والشكاوى:
- ركّز إن العميل يبعت الاسم ثنائي (اسمين على الأقل)، ولو بعت الاسم أحادي (اسم واحد بس) اطلب منه بلطف يبعت الاسم ثنائي ومش هينفع يتسجل أحادي.
- لو العميل بعت اسم ثنائي وطلع في اسم تاني مسجل زيه (أو الأداة رجّعت duplicate_name_found أو duplicate_two_part_name)، اطلب من العميل يكتب الاسم ثلاثي عشان ميحصلش لخبطة.
- لو لاحظت إن رقم الموبايل ناقص عن 11 رقم أو مش كامل أو الأداة رجّعت incomplete_or_invalid_phone، وضّح للعميل بلطف يراجع الرقم ويبعته كامل من 11 رقم.

الخدمات والأسعار الحالية:
${catalogText}

تعليمات تسجيل الشكاوى ومطابقتها بالأوردر السابق:
- إذا عبّر العميل عن شكوى أو طلب جديد لأول مرة، خذ منه الاسم ورقم الموبايل لو لم يذكرهما، ثم استدعِ submit_customer_interaction مرة واحدة لتسجيلها (وهي تراجع الأوردر السابق للعميل تلقائياً).
- إذا أرجعت submit_customer_interaction أن service_mismatch_with_last_order يساوي true أو وجود previous_items_summary مختلف عن القطعة التي يشتكي منها العميل (مثلاً العميل يشتكي من مرتبة بينما الأوردر السابق المسجل معه كان سجاد)، وضّح للعميل بلطف وشياكة إن الأوردر المسجل معانا كان (اذكر الخدمة الفعلية من previous_items_summary) وأنه قد يكون تعامل على القطعة الأخرى مع جهة أخرى، مع تأكيد تسجيل ملاحظته للإدارة للمراجعة.
- إذا أضاف العميل بعد ذلك ملاحظة أو طلب متابعة أو حدد وقت تواصل بخصوص نفس الشكوى، استدعِ append_interaction_note لإلحاق ملاحظة العميل بنفس الشكوى القائمة ولا تستدعِ submit_customer_interaction مرة أخرى.
- لا تنسخ كلام العميل حرفياً كما هو؛ اكتب subject كعنوان واضح ومباشر، واكتب summary كملخص بسيط ومفهوم، واكتب details بشكل مرتب وواضح ومفهوم للشخص المسؤول في الإدارة.
- لا تؤكد أن الشكوى أو الملاحظة تم تسجيلها إلا بعد نجاح تنفيذ الأداة فعلياً.

تعليمات التحكم في الحجوزات:
- أنت مسؤول كامل مثل موظف الحجوزات: إذا طلب العميل تأجيل/تغيير ميعاد أو فترة، أو إلغاء حجز، أو تعليق حجز، يجب أن تستدعي أولاً lookup_customer_bookings لمعرفة الحجز الحالي، ثم تنفذ التعديل الفعلي في قاعدة البيانات عبر update_booking_schedule أو update_booking_status (بحالة cancelled للإلغاء أو pending للتعليق)، ولا تؤكد للعميل أن التعديل أو الإلغاء تم إلا بعد نجاح تنفيذ الأداة فعلياً.`
        }]
      };

      let data = await sendGeminiRequestWithFallback({
        system_instruction: systemInstruction,
        contents: chatHistory,
        tools: toolsDeclaration
      });

      let candidate = data.candidates[0];
      let modelParts = candidate.content.parts || [];

      while (modelParts.some(p => p.functionCall)) {
        chatHistory.push({ role: 'model', parts: modelParts });
        const functionResponsesParts = [];
        for (const part of modelParts) {
          if (part.functionCall) {
            const toolResult = await executeToolCall(part.functionCall);
            functionResponsesParts.push({
              functionResponse: { name: part.functionCall.name, response: toolResult }
            });
          }
        }
        chatHistory.push({ role: 'user', parts: functionResponsesParts });
        data = await sendGeminiRequestWithFallback({
          system_instruction: systemInstruction,
          contents: chatHistory,
          tools: toolsDeclaration
        });
        candidate = data.candidates[0];
        modelParts = candidate.content.parts || [];
      }

      const finalText = modelParts.map(p => p.text || '').join('\n').trim();
      chatHistory.push({ role: 'model', parts: [{ text: finalText }] });
      return finalText;
    }

    function appendMessageUI(role, text) {
      const box = document.getElementById('chatContainer');
      const wrapper = document.createElement('div');
      const isUser = role === 'user';
      wrapper.className = isUser ? 'flex items-start justify-end gap-2.5' : 'flex items-start gap-3';

      if (!isUser) {
        const avatar = document.createElement('div');
        avatar.className = 'w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 text-white flex items-center justify-center shrink-0 mt-1 text-[10px] font-extrabold shadow-sm';
        avatar.textContent = 'أحمد';
        wrapper.appendChild(avatar);
      }

      const content = document.createElement('div');
      content.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} max-w-[85%] min-w-0`;
      const bubble = document.createElement('div');
      bubble.className = isUser
        ? 'message-text bg-gradient-to-l from-purple-600 to-indigo-600 text-white rounded-2xl rounded-tl-none p-3.5 text-sm leading-relaxed w-fit max-w-full shadow-md'
        : 'message-text bg-white border border-purple-100 text-slate-800 rounded-2xl rounded-tr-none p-4 text-sm leading-relaxed w-fit max-w-full shadow-sm';
      bubble.textContent = String(text ?? '');

      content.appendChild(bubble);
      wrapper.appendChild(content);
      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage(e) {
      if (e && e.preventDefault) e.preventDefault();
      const input = document.getElementById('userInput');
      const btn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text || requestInProgress) return;

      requestInProgress = true;
      input.value = '';
      autoResizeInput(input);
      appendMessageUI('user', text);
      chatHistory.push({ role: 'user', parts: [{ text }] });
      await logConversation({ speaker: 'customer', event_type: 'message', message: text });

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-pulse">يكتب...</span>`;

      try {
        const reply = await callGeminiAgent();
        appendMessageUI('model', reply);
        await logConversation({ speaker: 'assistant', event_type: 'reply', message: reply });
      } catch (err) {
        const errMsg = `خطأ من جوجل: ` + err.message;
        appendMessageUI('model', errMsg);
        await logConversation({ speaker: 'system', event_type: 'error', message: err.message });
      } finally {
        requestInProgress = false;
        btn.disabled = false;
        btn.innerHTML = `<span>إرسال</span><i data-lucide="send" class="w-4 h-4"></i>`;
        lucide.createIcons();
        input.focus();
      }
    }

    function showWelcomeMessage() {
      appendMessageUI('model', 'أهلاً بحضرتك يا فندم، معاك أحمد من Top Wash ✨ أقدر أساعد حضرتك في إيه النهاردة؟');
    }

    function resetChat() {
      chatHistory = [];
      lastSharedLocationUrl = '';
      selectedCustomerCoordinates = null;
      lastSubmittedInteractionId = null;
      conversationSessionId = createSessionId();
      const input = document.getElementById('userInput');
      if (input) {
        input.value = '';
        autoResizeInput(input);
      }
      document.getElementById('chatContainer').innerHTML = '';
      showWelcomeMessage();
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      showWelcomeMessage();
      loadInitialCatalog();
    });
  </script>
