<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المساعد الذكي لحجز تنظيف المفروشات</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Interactive map (Leaflet + OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #e0e7ff 100%);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }
    #chatContainer .message-text { overflow-wrap: anywhere; word-break: normal; white-space: pre-wrap; }
  </style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center p-0 md:p-4 lg:p-6 overflow-x-hidden">

  <!-- Main Elegant Chat Container -->
  <main class="w-full max-w-3xl h-[100dvh] md:h-[88vh] md:max-h-[850px] bg-white/95 backdrop-blur-xl md:rounded-3xl shadow-2xl border border-purple-100 flex flex-col overflow-hidden">
    
    <!-- Modern Royal Purple & Indigo Header -->
    <header class="bg-gradient-to-l from-purple-700 via-violet-600 to-indigo-600 px-4 md:px-6 py-3.5 md:py-4 text-white flex items-center justify-between shrink-0 shadow-md">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="w-10 h-10 md:w-11 md:h-11 rounded-2xl bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center shadow-inner">
            <i data-lucide="sparkles" class="w-5 h-5 md:w-6 md:h-6 text-white"></i>
          </div>
          <span class="w-2.5 h-2.5 md:w-3 md:h-3 bg-emerald-400 rounded-full absolute -bottom-0.5 -right-0.5 ring-2 ring-purple-700"></span>
        </div>
        <div>
          <h1 class="font-extrabold text-sm md:text-lg tracking-wide">خدمة العملاء والحجز الذكي</h1>
          <p class="text-[11px] md:text-xs text-purple-100 flex items-center gap-1.5">
            <span>العناية وتنظيف المفروشات بالبخار</span>
            <span class="hidden sm:inline">•</span>
            <span class="text-emerald-300 font-semibold">يرد فوريًا</span>
          </p>
        </div>
      </div>

      <button onclick="resetChat()" class="px-2.5 md:px-3 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 border border-white/20 text-[11px] md:text-xs font-bold flex items-center gap-1.5 transition shrink-0">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>محادثة جديدة</span>
      </button>
    </header>

    <!-- Chat Messages Area -->
    <div id="chatContainer" class="flex-1 overflow-y-auto p-3 md:p-5 space-y-4 bg-slate-50/70">
      <!-- Welcome message is rendered on page load with its local timestamp. -->
    </div>

    <!-- Bottom Input Bar -->
    <div class="p-3 md:p-3.5 bg-white border-t border-slate-100 shrink-0">
      <form onsubmit="sendMessage(event)" class="flex items-center gap-2">
        <!-- Location Helper Button -->
        <button
          type="button"
          onclick="openMapModal()"
          class="bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 px-3 md:px-3.5 py-2.5 md:py-3 rounded-2xl text-[11px] md:text-xs font-bold flex items-center gap-1 transition shrink-0 shadow-sm"
          title="تحديد الموقع أو إرسال العنوان بالتفصيل"
        >
          <i data-lucide="map-pin" class="w-4 h-4 text-purple-600"></i>
          <span class="hidden sm:inline">إرسال العنوان</span>
        </button>

        <input
          id="userInput"
          type="text"
          placeholder="اكتب رسالتك هنا..."
          class="flex-1 bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 rounded-2xl px-3.5 md:px-4 py-2.5 md:py-3 text-xs md:text-sm focus:outline-none focus:border-purple-500 focus:bg-white transition"
          autocomplete="off"
        />

        <button
          id="sendBtn"
          type="submit"
          class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white px-4 md:px-5 py-2.5 md:py-3 rounded-2xl font-bold text-xs md:text-sm flex items-center gap-1.5 transition shrink-0 shadow-md shadow-purple-500/20"
        >
          <span>إرسال</span>
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

  </main>

  <!-- Location Modal -->
  <div id="mapModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-3 md:p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-purple-100 flex flex-col max-h-[90vh]">
      <div class="p-3.5 md:p-4 bg-gradient-to-l from-purple-700 to-indigo-600 text-white flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <i data-lucide="map-pin" class="w-5 h-5"></i>
          <h3 class="font-bold text-sm">مشاركة العنوان التفصيلي للتيم</h3>
        </div>
        <button onclick="closeMapModal()" class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30">✕</button>
      </div>

      <div class="p-3.5 md:p-4 space-y-3 overflow-y-auto flex-1">
        <div class="flex flex-wrap gap-2">
          <button type="button" onclick="locateCustomerNow()" class="flex-1 min-w-[160px] bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-extrabold shadow-sm">📍 حدد موقعي الآن</button>
          <button type="button" onclick="centerMapOnEgypt()" class="px-3.5 py-2.5 md:py-3 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold hover:bg-slate-200">عرض مصر</button>
        </div>
        <p id="locationStatus" class="text-xs text-slate-600 bg-slate-50 rounded-xl p-3 border border-slate-100">اسمح للمتصفح بالوصول للموقع، أو اضغط على الخريطة لتحديد مكانك يدويًا.</p>
        <div id="customerMap" class="w-full h-[260px] md:h-[320px] rounded-2xl border border-slate-200 z-0"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-[11px] font-bold text-slate-600 mb-1">خط العرض</label><input id="modalLatitude" readonly dir="ltr" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs" placeholder="لم يتم التحديد"></div>
          <div><label class="block text-[11px] font-bold text-slate-600 mb-1">خط الطول</label><input id="modalLongitude" readonly dir="ltr" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs" placeholder="لم يتم التحديد"></div>
        </div>
        <div><label class="block text-xs font-bold text-slate-700 mb-1">العنوان التفصيلي (المنطقة، الشارع، رقم العمارة، الدور)</label><input id="modalDetailedAddress" type="text" placeholder="مثال: المعادي - شارع 9 - عمارة 14 - الدور التاني" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-purple-600" /></div>
        <div class="flex items-center justify-between gap-2"><span class="text-[11px] text-slate-500">رابط الخريطة سيتولد تلقائيًا بعد تحديد الموقع.</span><a id="previewMapLink" href="#" target="_blank" rel="noopener" class="hidden text-xs font-bold text-indigo-600 underline">معاينة الموقع</a></div>
      </div>

      <div class="p-3.5 md:p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3 shrink-0">
        <button type="button" onclick="closeMapModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200">إلغاء</button>
        <button type="button" onclick="confirmLocationModal()" class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 md:px-5 py-2.5 rounded-xl text-xs font-bold shadow">
          إرسال العنوان للبوت 📍
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jlaczyfdaxcdevcozcnx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vih4Lf_VGHooa_IxoicuCA_X0Bg2ESc';
    const GEMINI_KEY = localStorage.getItem('GM_KEY') || '';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let chatHistory = [];
    let catalogCache = [];
    let lastSharedLocationUrl = '';
    let customerMapInstance = null;
    let customerMapMarker = null;
    let selectedCustomerCoordinates = null;
    let requestInProgress = false;
    const conversationSessionId = (crypto.randomUUID ? crypto.randomUUID() : `tw-${Date.now()}-${Math.random().toString(36).slice(2)}`);

    async function logConversation(event) {
      try {
        await supabaseClient.from('conversation_logs').insert([{
          session_id: conversationSessionId,
          speaker: event.speaker || 'system',
          message: String(event.message || '').slice(0, 12000),
          event_type: event.event_type || 'message',
          tool_name: event.tool_name || null,
          tool_data: event.tool_data || null,
          customer_name: event.customer_name || null,
          customer_phone: normalizeEgyptianPhone(event.customer_phone) || null
        }]);
      } catch (e) { console.warn('Conversation log skipped:', e); }
    }

    function normalizeMapsUrl(raw) {
      const value = String(raw || '').trim();
      if (!value) return null;
      if (!/^https?:\/\//i.test(value)) return null;
      try {
        const url = new URL(value);
        const host = url.hostname.toLowerCase();
        if (!(host === 'maps.app.goo.gl' || host.endsWith('google.com') || host.endsWith('goo.gl') || host === 'maps.google.com')) return null;
        return url.href;
      } catch { return null; }
    }

    function getEgyptDateTime() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit',
        weekday: 'long', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      const arabicDay = new Intl.DateTimeFormat('ar-EG', {
        timeZone: 'Africa/Cairo', weekday: 'long'
      }).format(new Date());
      return {
        date: `${values.year}-${values.month}-${values.day}`,
        day: arabicDay,
        time: new Intl.DateTimeFormat('ar-EG', {
          timeZone: 'Africa/Cairo', hour: 'numeric', minute: '2-digit', hour12: true
        }).format(new Date())
      };
    }

    function normalizeEgyptianPhone(value) {
      let phone = String(value || '').replace(/[\s٠-٩]/g, ch => {
        if (/^[٠-٩]$/.test(ch)) return String('٠١٢٣٤٥٦٧٨٩'.indexOf(ch));
        return '';
      }).replace(/[()\-]/g, '');
      if (phone.startsWith('+20')) phone = '0' + phone.slice(3);
      else if (phone.startsWith('20') && phone.length === 12) phone = '0' + phone.slice(2);
      return /^01[0125]\d{8}$/.test(phone) ? phone : null;
    }

    function phoneValidationResult(value) {
      const normalized = normalizeEgyptianPhone(value);
      return normalized
        ? { valid: true, phone: normalized }
        : { valid: false, status: 'invalid_phone', message: 'رقم الهاتف غير مكتمل أو غير صحيح.' };
    }

    async function loadInitialCatalog() {
      const { data } = await supabaseClient.from('services_catalog').select('*');
      catalogCache = data || [];
    }

    function openMapModal() {
      const modal = document.getElementById('mapModal');
      modal.classList.remove('hidden'); modal.classList.add('flex');
      setTimeout(() => {
        if (!customerMapInstance) {
          customerMapInstance = L.map('customerMap', { zoomControl: true }).setView([30.0444, 31.2357], 11);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(customerMapInstance);
          customerMapInstance.on('click', e => setCustomerMapPoint(e.latlng.lat, e.latlng.lng, 'تم تحديد الموقع يدويًا.'));
        }
        customerMapInstance.invalidateSize();
      }, 180);
    }

    function closeMapModal() {
      document.getElementById('mapModal').classList.add('hidden');
      document.getElementById('mapModal').classList.remove('flex');
    }

    function centerMapOnEgypt() {
      if (customerMapInstance) customerMapInstance.setView([26.8206, 30.8025], 6);
    }

    function setCustomerMapPoint(lat, lng, statusText) {
      selectedCustomerCoordinates = { latitude: Number(lat), longitude: Number(lng) };
      const point = [selectedCustomerCoordinates.latitude, selectedCustomerCoordinates.longitude];
      if (!customerMapMarker) {
        customerMapMarker = L.marker(point, { draggable: true }).addTo(customerMapInstance);
        customerMapMarker.on('dragend', () => {
          const p = customerMapMarker.getLatLng();
          setCustomerMapPoint(p.lat, p.lng, 'تم تحديث موقع العلامة.');
        });
      } else customerMapMarker.setLatLng(point);
      customerMapInstance.setView(point, Math.max(customerMapInstance.getZoom(), 16));
      document.getElementById('modalLatitude').value = selectedCustomerCoordinates.latitude.toFixed(7);
      document.getElementById('modalLongitude').value = selectedCustomerCoordinates.longitude.toFixed(7);
      const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${selectedCustomerCoordinates.latitude},${selectedCustomerCoordinates.longitude}`)}`;
      const link = document.getElementById('previewMapLink'); link.href = url; link.classList.remove('hidden');
      document.getElementById('locationStatus').textContent = statusText || 'تم تحديد الموقع بنجاح.';
    }

    function locateCustomerNow() {
      const status = document.getElementById('locationStatus');
      if (!navigator.geolocation) { status.textContent = 'المتصفح لا يدعم تحديد الموقع.'; return; }
      status.textContent = 'جارٍ تحديد موقعك…';
      navigator.geolocation.getCurrentPosition(pos => {
        setCustomerMapPoint(pos.coords.latitude, pos.coords.longitude, 'تم تحديد موقعك بنجاح.');
      }, err => {
        status.textContent = 'تعذر تحديد الموقع تلقائيًا، يرجى التحديد من الخريطة يدويًا.';
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    }

    function confirmLocationModal() {
      const address = document.getElementById('modalDetailedAddress').value.trim();
      if (!selectedCustomerCoordinates) { alert('حدد موقعك أولاً من الخريطة.'); return; }
      if (!address) { alert('اكتب العنوان التفصيلي.'); return; }
      const { latitude, longitude } = selectedCustomerCoordinates;
      lastSharedLocationUrl = `https://www.google.com/maps/search/?api=1&query=${latitude},${longitude}`;
      closeMapModal();
      document.getElementById('userInput').value = `📍 عنواني بالتفصيل: ${address}\nإحداثيات موقعي: ${latitude}, ${longitude}\nرابط Google Maps: ${lastSharedLocationUrl}`;
      sendMessage(new Event('submit'));
      document.getElementById('modalDetailedAddress').value = '';
    }

    async function executeToolCall(call) {
      const { name, args } = call;

      if (name === 'request_customer_location') {
        openMapModal();
        return { status: 'location_picker_opened', message: 'تم فتح خريطة تحديد الموقع للعميل.' };
      }

      if (name === 'calculate_cleaning_price') {
        const { data: catalog } = await supabaseClient.from('services_catalog').select('*');
        let total = 0;
        const details = [];
        const missingItems = [];
        for (const reqItem of (args.items || [])) {
          const found = catalog?.find(c => c.item_key === reqItem.item_key);
          if (found && Number.isFinite(Number(found.price))) {
            const quantity = Number(reqItem.quantity);
            const sub = Number(found.price) * quantity;
            total += sub;
            details.push(`${quantity} ${found.item_name_ar} (${sub} ج.م)`);
          } else {
            missingItems.push(reqItem.item_key);
          }
        }
        return missingItems.length
          ? { status: 'missing_catalog_items', missing_items: missingItems }
          : { status: 'success', total_price: total, breakdown: details.join(' + ') };
      }

      if (name === 'check_schedule_by_area') {
        const clientArea = (args.client_area || '').trim();
        const { data: zones } = await supabaseClient.from('zones').select('*');
        const matchedZone = zones?.find(z => z.covered_areas.some(a => clientArea.includes(a) || a.includes(clientArea)));
        const today = getEgyptDateTime().date;
        if (!matchedZone) return { status: 'available', message: 'متاح الحجز في الفترات المعتادة.' };
        const { data: existingBookings } = await supabaseClient.from('bookings').select('booking_date, time_slot, area').eq('zone_id', matchedZone.id).gte('booking_date', today);
        return { status: 'matched_zone', zone_name: matchedZone.zone_name, team_current_bookings: existingBookings || [] };
      }

      if (name === 'confirm_booking') {
        const phoneCheck = phoneValidationResult(args.client_phone);
        if (!phoneCheck.valid) return phoneCheck;
        const { data, error } = await supabaseClient.from('bookings').insert([{
          client_name: String(args.client_name).trim(),
          client_phone: phoneCheck.phone,
          area: String(args.area).trim(),
          detailed_address: args.detailed_address || null,
          maps_url: normalizeMapsUrl(args.maps_url),
          latitude: args.latitude || null,
          longitude: args.longitude || null,
          booking_date: args.booking_date,
          time_slot: args.time_slot,
          items_summary: args.items_summary,
          total_price: Number(args.total_price),
          status: 'confirmed'
        }]).select().single();
        if (error) return { status: 'error', message: error.message };
        return { status: 'booked_successfully', booking_details: data };
      }

      return { status: 'success' };
    }

    // تم تحديث الموديل إلى gemini-3.8-flash بناءً على طلب جوجل الأخير
    async function sendGeminiRequestWithFallback(payload) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${GEMINI_KEY}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.error) {
        throw new Error(data.error.message || 'API Error');
      }
      return data;
    }

    async function callGeminiAgent() {
      if (!catalogCache.length) await loadInitialCatalog();
      const egyptNow = getEgyptDateTime();
      const toolsDeclaration = [{
        functionDeclarations: [
          {
            name: 'calculate_cleaning_price',
            description: 'حساب التكلفة الإجمالية لتنظيف المفروشات.',
            parameters: {
              type: 'OBJECT',
              properties: {
                items: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      item_key: { type: 'STRING' },
                      quantity: { type: 'NUMBER' }
                    },
                    required: ['item_key', 'quantity']
                  }
                }
              },
              required: ['items']
            }
          },
          {
            name: 'check_schedule_by_area',
            description: 'فحص المواعيد حسب المنطقة.',
            parameters: { type: 'OBJECT', properties: { client_area: { type: 'STRING' } }, required: ['client_area'] }
          },
          {
            name: 'request_customer_location',
            description: 'فتح الخريطة لتحديد موقع العميل.',
            parameters: { type: 'OBJECT', properties: {} }
          },
          {
            name: 'confirm_booking',
            description: 'تأكيد الحجز.',
            parameters: {
              type: 'OBJECT',
              properties: {
                client_name: { type: 'STRING' },
                client_phone: { type: 'STRING' },
                area: { type: 'STRING' },
                detailed_address: { type: 'STRING' },
                maps_url: { type: 'STRING' },
                latitude: { type: 'NUMBER' },
                longitude: { type: 'NUMBER' },
                booking_date: { type: 'STRING' },
                time_slot: { type: 'STRING' },
                items_summary: { type: 'STRING' },
                total_price: { type: 'NUMBER' }
              },
              required: ['client_name', 'client_phone', 'area', 'booking_date', 'time_slot', 'items_summary', 'total_price']
            }
          }
        ]
      }];

      const systemInstruction = {
        parts: [{
          text: `أنت أحمد، موظف خدمة عملاء في شركة Top Wash لتنظيف المفروشات في مصر. اليوم: ${egyptNow.day} الموافق ${egyptNow.date} والوقت ${egyptNow.time}. تكلم بالمصري المهذب والطبيعي، ورد بإيجاز.`
        }]
      };

      let data = await sendGeminiRequestWithFallback({
        system_instruction: systemInstruction,
        contents: chatHistory,
        tools: toolsDeclaration
      });

      let candidate = data.candidates[0];
      let modelParts = candidate.content.parts;

      while (modelParts && modelParts.some(p => p.functionCall)) {
        chatHistory.push({ role: 'model', parts: modelParts });
        const functionResponsesParts = [];
        for (const part of modelParts) {
          if (part.functionCall) {
            const toolResult = await executeToolCall(part.functionCall);
            functionResponsesParts.push({
              functionResponse: { name: part.functionCall.name, response: toolResult }
            });
          }
        }
        chatHistory.push({ role: 'user', parts: functionResponsesParts });
        data = await sendGeminiRequestWithFallback({
          system_instruction: systemInstruction,
          contents: chatHistory,
          tools: toolsDeclaration
        });
        candidate = data.candidates[0];
        modelParts = candidate.content.parts;
      }

      const finalText = (modelParts || []).map(p => p.text || '').join('\n');
      chatHistory.push({ role: 'model', parts: [{ text: finalText }] });
      return finalText;
    }

    function appendMessageUI(role, text) {
      const box = document.getElementById('chatContainer');
      const wrapper = document.createElement('div');
      const isUser = role === 'user';
      wrapper.className = isUser ? 'flex items-start justify-end gap-2.5' : 'flex items-start gap-3';

      if (!isUser) {
        const avatar = document.createElement('div');
        avatar.className = 'w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 text-white flex items-center justify-center shrink-0 mt-1 text-[10px] font-extrabold shadow-sm';
        avatar.textContent = 'أحمد';
        wrapper.appendChild(avatar);
      }

      const content = document.createElement('div');
      content.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} max-w-[85%] min-w-0`;
      const bubble = document.createElement('div');
      bubble.className = isUser
        ? 'message-text bg-gradient-to-l from-purple-600 to-indigo-600 text-white rounded-2xl rounded-tl-none p-3.5 text-sm leading-relaxed w-fit max-w-full shadow-md'
        : 'message-text bg-white border border-purple-100 text-slate-800 rounded-2xl rounded-tr-none p-4 text-sm leading-relaxed w-fit max-w-full shadow-sm';
      bubble.textContent = String(text ?? '');

      content.appendChild(bubble);
      wrapper.appendChild(content);
      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage(e) {
      if (e && e.preventDefault) e.preventDefault();
      const input = document.getElementById('userInput');
      const btn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text || requestInProgress) return;

      requestInProgress = true;
      input.value = '';
      appendMessageUI('user', text);
      chatHistory.push({ role: 'user', parts: [{ text }] });

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-pulse">يكتب...</span>`;

      try {
        const reply = await callGeminiAgent();
        appendMessageUI('model', reply);
      } catch (err) {
        appendMessageUI('model', `خطأ من جوجل: ` + err.message);
      } finally {
        requestInProgress = false;
        btn.disabled = false;
        btn.innerHTML = `<span>إرسال</span><i data-lucide="send" class="w-4 h-4"></i>`;
        lucide.createIcons();
        input.focus();
      }
    }

    function showWelcomeMessage() {
      appendMessageUI('model', 'أهلاً بحضرتك يا فندم معاك احمد من Top Wash ✨ حضرتك محتاج تنظف إيه عشان اقدر اساعد حضرتك ؟');
    }

    function resetChat() {
      chatHistory = [];
      document.getElementById('chatContainer').innerHTML = '';
      showWelcomeMessage();
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      showWelcomeMessage();
      loadInitialCatalog();
    });
  </script>
</body>
</html>
